name: Deploy Shinylive app

on:
  push:
    branches: [shiny]      # change to the branch(es) you deploy from
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::shinylive
            any::webr
            local::.

      - name: Export app
        run: Rscript -e 'shinylive::export("inst/shinyapp", "shinylive-site")'

      - name: Add .nojekyll
        run: touch shinylive-site/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: shinylive-site
          publish_branch: gh-pages
