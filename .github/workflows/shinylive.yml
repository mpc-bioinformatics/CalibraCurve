name: Deploy Shinylive app
on:
  push:
    branches: [main, shiny, devel]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - run: Rscript -e 'install.packages("shinylive")'
      - run: Rscript -e 'shinylive::export("inst/shinyapp", "shinylive-site")'
      - run: touch shinylive-site/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: shinylive-site
          publish_branch: gh-pages
